<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img">
<style>
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
        --grid:#2c2c2a; --axis:#383835; --box:#232322; --ring:rgba(255,255,255,0.16);
        --s1:#3987e5; --s2:#d95926; --s1a:#5598e7; --s1b:#2a78d6; --s1c:#184f95;
        --crit:#e66767; --good:#0ca30c; --warn:#c98500; }
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         fill: var(--ink); }
  .t   { font-size:17px; font-weight:600; }
  .st  { font-size:13px; fill:var(--ink2); }
  .lbl { font-size:13px; fill:var(--ink); }
  .lblb{ font-size:13px; font-weight:600; fill:var(--ink); }
  .sm  { font-size:12px; fill:var(--ink2); }
  .xs  { font-size:11px; fill:var(--muted); }
  .num { font-size:12.5px; font-weight:600; fill:var(--ink);
         font-variant-numeric: tabular-nums; }
  .tick{ font-size:11px; fill:var(--muted); font-variant-numeric: tabular-nums; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--axis)"/>
  </marker>
  <marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--crit)"/>
  </marker>
</defs>
<rect width="940" height="470" rx="8" fill="var(--surface)"/>
<text class="t" x="20" y="34">What an adversary keeps after downloading the weights</text>
<text class="st" x="20" y="56">The release decision moves the defensive boundary. Everything the attacker can strip is optional for the attacker.</text>
<line x1="478" y1="96" x2="478" y2="362" stroke="var(--crit)" stroke-width="2" stroke-dasharray="6 5"/>
<text class="lblb" x="478" y="84" fill="var(--crit)" text-anchor="middle">weights released</text>
<rect x="20" y="122" width="400" height="74" rx="7" fill="var(--box)" stroke="var(--ring)"/>
<rect x="20" y="122" width="5" height="74" rx="2.5" fill="var(--good)"/>
<text class="lblb" x="38" y="148">Pretraining</text>
<text class="sm" x="38" y="168" font-size="11.5">Data filtering, safety-relevant</text>
<text class="sm" x="38" y="184" font-size="11.5">corpus design</text>
<line x1="428" y1="159.0" x2="490" y2="159.0" stroke="var(--good)" stroke-width="2" marker-end="url(#ah)"/>
<text class="sm" x="504" y="164.0" fill="var(--good)" font-weight="600">Baked into the weights</text>
<rect x="20" y="212" width="400" height="74" rx="7" fill="var(--box)" stroke="var(--ring)"/>
<rect x="20" y="212" width="5" height="74" rx="2.5" fill="var(--warn)"/>
<text class="lblb" x="38" y="238">Post-training</text>
<text class="sm" x="38" y="258" font-size="11.5">RLHF, refusal training, unlearning,</text>
<text class="sm" x="38" y="274" font-size="11.5">circuit breakers</text>
<line x1="428" y1="249.0" x2="467" y2="249.0" stroke="var(--warn)" stroke-width="2"/>
<line x1="470" y1="241.0" x2="486" y2="257.0" stroke="var(--warn)" stroke-width="2.6"/>
<line x1="486" y1="241.0" x2="470" y2="257.0" stroke="var(--warn)" stroke-width="2.6"/>
<text class="sm" x="504" y="254.0" fill="var(--warn)" font-weight="600">Removable by fine-tuning</text>
<rect x="20" y="302" width="400" height="74" rx="7" fill="var(--box)" stroke="var(--ring)"/>
<rect x="20" y="302" width="5" height="74" rx="2.5" fill="var(--crit)"/>
<text class="lblb" x="38" y="328">Deployment</text>
<text class="sm" x="38" y="348" font-size="11.5">Input/output classifiers, rate limits,</text>
<text class="sm" x="38" y="364" font-size="11.5">logging, KYC</text>
<line x1="428" y1="339.0" x2="467" y2="339.0" stroke="var(--crit)" stroke-width="2"/>
<line x1="470" y1="331.0" x2="486" y2="347.0" stroke="var(--crit)" stroke-width="2.6"/>
<line x1="486" y1="331.0" x2="470" y2="347.0" stroke="var(--crit)" stroke-width="2.6"/>
<text class="sm" x="504" y="344.0" fill="var(--crit)" font-weight="600">Not shipped at all</text>
<text class="xs" x="20" y="408">Reported costs to strip the refusal layer: 340 examples for up to 95% circumvention (Zhan et al. 2023); a LoRA fine-tune for about 1% refusal</text>
<text class="xs" x="20" y="428">on Llama 2-Chat 70B (Lermen et al. 2023); 100 samples for 88% on ChatGPT and over 91% on open models (Bhardwaj &amp; Poria 2023).</text>
<text class="xs" x="20" y="448">Even benign fine-tuning erodes it (Qi et al. 2024). Red teaming only the aligned checkpoint characterizes a configuration no adversary will run.</text>
</svg>
