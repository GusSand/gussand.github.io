<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img">
<style>
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
        --grid:#2c2c2a; --axis:#383835; --box:#232322; --ring:rgba(255,255,255,0.16);
        --s1:#3987e5; --s2:#d95926; --s1a:#5598e7; --s1b:#2a78d6; --s1c:#184f95;
        --crit:#e66767; --good:#0ca30c; --warn:#c98500; }
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         fill: var(--ink); }
  .t   { font-size:17px; font-weight:600; }
  .st  { font-size:13px; fill:var(--ink2); }
  .hd  { font-size:13.5px; font-weight:600; letter-spacing:0.06em; }
  .lbl { font-size:13px; fill:var(--ink); }
  .lblb{ font-size:13px; font-weight:600; fill:var(--ink); }
  .sm  { font-size:11.5px; fill:var(--ink2); }
  .xs  { font-size:11px; fill:var(--muted); }
</style>
<defs>
  <marker id="jah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--axis)"/>
  </marker>
</defs>
<rect width="940" height="450" rx="8" fill="var(--surface)"/>
<text class="t" x="20" y="34">Two attacks, sorted by what they override</text>
<text class="st" x="20" y="56">Orange is the attacker, blue is what gets overridden. The same technique, such as role-play, can serve either attack.</text>
<rect x="20" y="76" width="290" height="354" rx="7" fill="none" stroke="var(--grid)" stroke-width="1.3"/>
<text class="hd" x="36" y="104" fill="var(--s2)">JAILBREAK</text>
<text class="sm" x="36" y="123">Targets the model&#8217;s safety training</text>
<rect x="34" y="166" width="262" height="52" rx="6" fill="var(--s2)" fill-opacity="0.15" stroke="var(--s2)" stroke-width="1.3"/>
<text class="lblb" x="46" y="184">User</text>
<text class="sm" x="46" y="199">Wants content the model was trained</text>
<text class="sm" x="46" y="213">to refuse, and asks in a costume</text>
<line x1="165" y1="218" x2="165" y2="230" stroke="var(--axis)" stroke-width="1.4" marker-end="url(#jah)"/>
<rect x="34" y="232" width="262" height="52" rx="6" fill="var(--s1)" fill-opacity="0.15" stroke="var(--s1)" stroke-width="1.3"/>
<text class="lblb" x="46" y="250">Safety training</text>
<text class="sm" x="46" y="265">Refusal was tied to the phrasing,</text>
<text class="sm" x="46" y="279">not to the content</text>
<line x1="165" y1="284" x2="165" y2="296" stroke="var(--axis)" stroke-width="1.4" marker-end="url(#jah)"/>
<rect x="34" y="298" width="262" height="52" rx="6" fill="var(--box)" stroke="var(--ring)" stroke-width="1.1"/>
<text class="lblb" x="46" y="316">Who gets hurt</text>
<text class="sm" x="46" y="331">Whoever the content is used on;</text>
<text class="sm" x="46" y="345">the operator&#8217;s setup is untouched</text>
<text class="xs" x="36" y="374">Defense: harm recognition in the model.</text>
<text class="xs" x="36" y="392">Example: the grandmother.</text>
<rect x="325" y="76" width="595" height="354" rx="7" fill="none" stroke="var(--grid)" stroke-width="1.3"/>
<text class="hd" x="341" y="104" fill="var(--s2)">PROMPT INJECTION</text>
<text class="sm" x="341" y="123">Targets the operator&#8217;s configuration: system prompt, persona, allowed tools. Splits by delivery.</text>
<text class="lblb" x="341" y="154">Direct: the attacker types it</text>
<text class="lblb" x="644" y="154">Indirect: the attacker plants it</text>
<line x1="622" y1="140" x2="622" y2="410" stroke="var(--grid)" stroke-width="1.1" stroke-dasharray="4 4"/>
<rect x="339" y="166" width="262" height="52" rx="6" fill="var(--s2)" fill-opacity="0.15" stroke="var(--s2)" stroke-width="1.3"/>
<text class="lblb" x="351" y="184">User</text>
<text class="sm" x="351" y="199">Types instructions that contradict</text>
<text class="sm" x="351" y="213">the system prompt</text>
<line x1="470" y1="218" x2="470" y2="230" stroke="var(--axis)" stroke-width="1.4" marker-end="url(#jah)"/>
<rect x="339" y="232" width="262" height="52" rx="6" fill="var(--s1)" fill-opacity="0.15" stroke="var(--s1)" stroke-width="1.3"/>
<text class="lblb" x="351" y="250">System prompt, persona, tools</text>
<text class="sm" x="351" y="265">Leaks the prompt, drops the role,</text>
<text class="sm" x="351" y="279">or uses tools it was told not to</text>
<line x1="470" y1="284" x2="470" y2="296" stroke="var(--axis)" stroke-width="1.4" marker-end="url(#jah)"/>
<rect x="339" y="298" width="262" height="52" rx="6" fill="var(--box)" stroke="var(--ring)" stroke-width="1.1"/>
<text class="lblb" x="351" y="316">Who gets hurt</text>
<text class="sm" x="351" y="331">The operator who deployed the</text>
<text class="sm" x="351" y="345">model</text>
<text class="xs" x="341" y="374">Defense: an instruction hierarchy.</text>
<text class="xs" x="341" y="392">Examples: &#8220;ignore the above,&#8221; remoteli.io.</text>
<rect x="642" y="166" width="262" height="52" rx="6" fill="var(--s2)" fill-opacity="0.15" stroke="var(--s2)" stroke-width="1.3"/>
<text class="lblb" x="654" y="184">Third party</text>
<text class="sm" x="654" y="199">Plants text in a web page, email, or</text>
<text class="sm" x="654" y="213">document the model later reads</text>
<line x1="773" y1="218" x2="773" y2="230" stroke="var(--axis)" stroke-width="1.4" marker-end="url(#jah)"/>
<rect x="642" y="232" width="262" height="52" rx="6" fill="var(--s1)" fill-opacity="0.15" stroke="var(--s1)" stroke-width="1.3"/>
<text class="lblb" x="654" y="250">Operator and user instructions</text>
<text class="sm" x="654" y="265">The planted text outranks what</text>
<text class="sm" x="654" y="279">the model was asked to do</text>
<line x1="773" y1="284" x2="773" y2="296" stroke="var(--axis)" stroke-width="1.4" marker-end="url(#jah)"/>
<rect x="642" y="298" width="262" height="52" rx="6" fill="var(--box)" stroke="var(--ring)" stroke-width="1.1"/>
<text class="lblb" x="654" y="316">Who gets hurt</text>
<text class="sm" x="654" y="331">Usually the user, who never saw</text>
<text class="sm" x="654" y="345">the attack (Fig. 2)</text>
<text class="xs" x="644" y="374">Defense: hierarchy, plus keeping data out</text>
<text class="xs" x="644" y="392">of the instruction channel.</text>
</svg>
