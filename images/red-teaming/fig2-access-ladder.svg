<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 486" width="940" height="486" role="img">
<style>
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
        --grid:#2c2c2a; --axis:#383835; --box:#232322; --ring:rgba(255,255,255,0.16);
        --s1:#3987e5; --s2:#d95926; --s1a:#5598e7; --s1b:#2a78d6; --s1c:#184f95;
        --crit:#e66767; --good:#0ca30c; --warn:#c98500; }
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         fill: var(--ink); }
  .t   { font-size:17px; font-weight:600; }
  .st  { font-size:13px; fill:var(--ink2); }
  .lbl { font-size:13px; fill:var(--ink); }
  .lblb{ font-size:13px; font-weight:600; fill:var(--ink); }
  .sm  { font-size:12px; fill:var(--ink2); }
  .xs  { font-size:11px; fill:var(--muted); }
  .num { font-size:12.5px; font-weight:600; fill:var(--ink);
         font-variant-numeric: tabular-nums; }
  .tick{ font-size:11px; fill:var(--muted); font-variant-numeric: tabular-nums; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--axis)"/>
  </marker>
  <marker id="ahk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--crit)"/>
  </marker>
</defs>
<rect width="940" height="486" rx="8" fill="var(--surface)"/>
<text class="t" x="20" y="34">The attack surface, ordered by access required</text>
<text class="st" x="20" y="56">Wider access is rarer. Most published red teaming lives on the top rung; most consequential attacks do not.</text>
<text class="xs" x="664" y="90">WHO CAN REACH IT</text>
<rect x="34" y="104" width="520" height="58" rx="6" fill="var(--s1a)" opacity="0.15" stroke="var(--s1a)" stroke-width="1.3"/>
<rect x="34" y="104" width="5" height="58" rx="2.5" fill="var(--s1a)"/>
<text class="lblb" x="52" y="128">User input in an integrated app</text>
<text class="sm" x="52" y="147" font-size="11.5">Jailbreaks, direct prompt injection</text>
<text class="sm" x="664" y="140">Anyone with the product</text>
<rect x="56" y="174" width="520" height="58" rx="6" fill="var(--s1)" opacity="0.15" stroke="var(--s1)" stroke-width="1.3"/>
<rect x="56" y="174" width="5" height="58" rx="2.5" fill="var(--s1)"/>
<text class="lblb" x="74" y="198">API parameters &amp; embeddings</text>
<text class="sm" x="74" y="217" font-size="11.5">logit_bias, decoding config, fine-tuning API</text>
<text class="sm" x="664" y="210">Any paying API customer</text>
<rect x="78" y="244" width="520" height="58" rx="6" fill="var(--s1)" opacity="0.15" stroke="var(--s1)" stroke-width="1.3"/>
<rect x="78" y="244" width="5" height="58" rx="2.5" fill="var(--s1)"/>
<text class="lblb" x="96" y="268">Retrieved &amp; tool-supplied context</text>
<text class="sm" x="96" y="287" font-size="11.5">Indirect injection, memory poisoning</text>
<text class="sm" x="664" y="280">Anyone who can publish content</text>
<rect x="100" y="314" width="520" height="58" rx="6" fill="var(--s1b)" opacity="0.15" stroke="var(--s1b)" stroke-width="1.3"/>
<rect x="100" y="314" width="5" height="58" rx="2.5" fill="var(--s1b)"/>
<text class="lblb" x="118" y="338">Weights</text>
<text class="sm" x="118" y="357" font-size="11.5">Adversarial fine-tuning, LoRA, ablation</text>
<text class="sm" x="664" y="350">Anyone who downloads an open release</text>
<rect x="122" y="384" width="520" height="58" rx="6" fill="var(--s1c)" opacity="0.15" stroke="var(--s1c)" stroke-width="1.3"/>
<rect x="122" y="384" width="5" height="58" rx="2.5" fill="var(--s1c)"/>
<text class="lblb" x="140" y="408">Training data, activations, tokenizer</text>
<text class="sm" x="140" y="427" font-size="11.5">Data poisoning, backdoors, latent-space attacks</text>
<text class="sm" x="664" y="420">Insider or state-level</text>
<line x1="20" y1="98" x2="20" y2="436" stroke="var(--axis)" stroke-width="1.4" marker-end="url(#ah)"/>
<text class="xs" x="26" y="254" transform="rotate(-90 26 254)" text-anchor="middle">access required</text>
<text class="xs" x="20" y="468">A defense is only real against adversaries who cannot reach below the rung it sits on.</text>
</svg>
