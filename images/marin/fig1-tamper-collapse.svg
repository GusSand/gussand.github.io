<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img" aria-label="HarmBench attack success under a LoRA fine-tuning attack. Olmo-3-7B-Instruct: 5.6, 10.9, 93.4, 99.1, 99.1, 99.1 percent at steps 0, 5, 10, 20, 40, 80. Marin-8B-Instruct: 15.6, 30.3, 97.8, 99.1, 99.1, 99.1 percent.">
<style>
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#3d3d3a; --a:#d95926; --b:#3987e5; }
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill: var(--ink); }
  .t{font-size:17px;font-weight:600;} .st{font-size:13px;fill:var(--ink2);} .lbl{font-size:13px;fill:var(--ink2);}
  .v{font-size:12.5px;font-weight:600;} .xs{font-size:11px;fill:var(--muted);}
</style>
<rect width="940" height="440" rx="8" fill="var(--surface)"/>
<text class="t" x="20" y="34">A small fine-tuning attack removes refusal from both models</text>
<text class="st" x="20" y="56">HarmBench attack success (%) after LoRA fine-tuning on about 100 public AdvBench pairs. Both pass 93% at step 10 and reach 99.1% at step 20.</text>
<line x1="80" y1="360.0" x2="900" y2="360.0" stroke="var(--grid)"/><text class="xs" x="70" y="364.0" text-anchor="end">0%</text>
