<line x1="80" y1="96.0" x2="900" y2="96.0" stroke="var(--grid)"/><text class="xs" x="70" y="100.0" text-anchor="end">100%</text>
<text class="lbl" x="80.0" y="382" text-anchor="middle">0</text>
<text class="lbl" x="244.0" y="382" text-anchor="middle">5</text>
