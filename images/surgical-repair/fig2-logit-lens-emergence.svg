<text class="tick" x="803.5" y="358" text-anchor="middle">L28</text>
<text class="tick" x="880.0" y="358" text-anchor="middle">L31</text>
<line x1="90" y1="340" x2="880" y2="340" stroke="var(--axis)" stroke-width="1.4"/>
<text class="xs" x="90.0" y="104">early encoding (L0): probes already at 100%</text>
<text class="xs" x="446.8" y="104" text-anchor="middle">latent propagation (L1 to L30)</text>
