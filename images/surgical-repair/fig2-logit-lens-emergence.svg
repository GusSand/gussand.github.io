<text class="num" x="868.0" y="187.7" text-anchor="end">36.9% logit lens</text>
<text class="num" x="701.6" y="327.3" text-anchor="middle">below 0.01% through L28, 0.15% at L30</text>
<rect x="20" y="66" width="11" height="11" rx="2.5" fill="var(--s1)"/>
<text class="sm" x="38" y="76">logit lens</text>
