<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 394" width="940" height="394" role="img">
<style>
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
        --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s2:#d95926; }
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill: var(--ink); }
  .t   { font-size:17px; font-weight:600; }
  .st  { font-size:13px; fill:var(--ink2); }
  .lbl { font-size:13px; fill:var(--ink); }
  .sm  { font-size:12px; fill:var(--ink2); }
  .xs  { font-size:11px; fill:var(--muted); }
  .num { font-size:12.5px; font-weight:600; fill:var(--ink); font-variant-numeric: tabular-nums; }
  .tick{ font-size:11px; fill:var(--muted); font-variant-numeric: tabular-nums; }
</style>
<rect width="940" height="394" rx="8" fill="var(--surface)"/>
<text class="t" x="20" y="34">One mean-difference vector at L31, per vulnerability: secure-generation rate</text>
<text class="st" x="300" y="76">Llama-3.1-8B-Instruct, leave-one-scenario-out</text>
<line x1="240.0" y1="90" x2="240.0" y2="330" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="240.0" y="348" text-anchor="middle">0%</text>
<line x1="395.0" y1="90" x2="395.0" y2="330" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="395.0" y="348" text-anchor="middle">25%</text>
<line x1="550.0" y1="90" x2="550.0" y2="330" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="550.0" y="348" text-anchor="middle">50%</text>
<line x1="705.0" y1="90" x2="705.0" y2="330" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="705.0" y="348" text-anchor="middle">75%</text>
<line x1="860.0" y1="90" x2="860.0" y2="330" stroke="var(--grid)" stroke-width="1"/>
<text class="tick" x="860.0" y="348" text-anchor="middle">100%</text>
<text class="lbl" x="226" y="114" text-anchor="end">CWE-787 sprintf to snprintf</text>
<line x1="281.5" y1="110" x2="694.5" y2="110" stroke="var(--axis)" stroke-width="2"/>
<circle cx="281.5" cy="110" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="694.5" cy="110" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<text class="num" x="706.5" y="114">73.3%  (+66.6 pp)</text>
<text class="lbl" x="226" y="154" text-anchor="end">CWE-79 escape HTML</text>
<line x1="241.2" y1="150" x2="429.1" y2="150" stroke="var(--axis)" stroke-width="2"/>
<circle cx="241.2" cy="150" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="429.1" cy="150" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<text class="num" x="441.1" y="154">30.5%  (+30.3 pp)</text>
<text class="lbl" x="226" y="194" text-anchor="end">CWE-89 parameterized SQL</text>
<line x1="593.4" y1="190" x2="726.7" y2="190" stroke="var(--axis)" stroke-width="2"/>
<circle cx="593.4" cy="190" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="726.7" cy="190" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<text class="num" x="738.7" y="194">78.5%  (+21.5 pp)</text>
<text class="lbl" x="226" y="234" text-anchor="end">CWE-119 strcpy/gets</text>
<line x1="240.0" y1="230" x2="364.0" y2="230" stroke="var(--axis)" stroke-width="2"/>
<circle cx="240.0" cy="230" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="364.0" cy="230" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<text class="num" x="376.0" y="234">20.0%  (+20.0 pp)</text>
<text class="lbl" x="226" y="274" text-anchor="end">CWE-78 subprocess</text>
<line x1="328.7" y1="270" x2="376.4" y2="270" stroke="var(--axis)" stroke-width="2"/>
<circle cx="328.7" cy="270" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="376.4" cy="270" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<text class="num" x="388.4" y="274">22.0%  (+7.7 pp)</text>
<text class="lbl" x="226" y="314" text-anchor="end">CWE-134 printf("%s")</text>
<line x1="675.2" y1="310" x2="704.4" y2="310" stroke="var(--axis)" stroke-width="2"/>
<circle cx="675.2" cy="310" r="5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
<circle cx="704.4" cy="310" r="5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
<text class="num" x="716.4" y="314">74.9%  (+4.7 pp)</text>
<rect x="20" y="66" width="11" height="11" rx="2.5" fill="var(--s2)"/>
<text class="sm" x="38" y="76">unsteered</text>
<rect x="126.8" y="66" width="11" height="11" rx="2.5" fill="var(--s1)"/>
<text class="sm" x="144.8" y="76">best steered</text>
<text class="xs" x="20" y="378">Held-out scenarios never seen when building the vector. Gains track how much the model knew in review (Fig. 1).</text>
</svg>