<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-label="Three beginner cohorts by average token spend on a heavy-use day. The zero cohort is near zero tokens. The single-agent cohort is around four million tokens a day. The multi-agent cohort sits at twelve to fifteen million. Above fifteen million the metric stops meaning anything.">
<style>
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
        --grid:#2c2c2a; --axis:#3d3d3a; --box:#232322;
        --s1:#3987e5; --s2:#d95926; --good:#0ca30c; }
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill: var(--ink); }
  .t {font-size:17px;font-weight:600;} .st{font-size:13px;fill:var(--ink2);}
  .ax{font-size:12px;fill:var(--muted);} .grp{font-size:14px;font-weight:600;}
  .val{font-size:13px;font-weight:600;} .sub{font-size:11.5px;fill:var(--muted);}
  .warn{font-size:12px;fill:var(--s2);font-weight:600;}
</style>
<rect width="940" height="360" rx="8" fill="var(--surface)"/>
<text class="t" x="20" y="34">A thermometer, not a thesis</text>
<text class="st" x="20" y="56">Average token spend on a heavy-use day, among people who use the tools at least three days a week.</text>

<!-- axis: baseline 300, 15M = 200px -> 13.33 px/M ; gridlines at 5,10,15 -->
<line x1="110" y1="300" x2="900" y2="300" stroke="var(--axis)"/>
<line x1="110" y1="233" x2="900" y2="233" stroke="var(--grid)"/>
<line x1="110" y1="167" x2="900" y2="167" stroke="var(--grid)"/>
<line x1="110" y1="100" x2="900" y2="100" stroke="var(--grid)"/>
<text class="ax" x="100" y="304" text-anchor="end">0</text>
<text class="ax" x="100" y="237" text-anchor="end">5M</text>
<text class="ax" x="100" y="171" text-anchor="end">10M</text>
<text class="ax" x="100" y="104" text-anchor="end">15M</text>

<!-- Zero -->
<rect x="200" y="297" width="120" height="3" rx="1.5" fill="var(--muted)"/>
<text class="val" x="260" y="289" text-anchor="middle" fill="var(--muted)">~0</text>
<text class="grp" x="260" y="326" text-anchor="middle">Zero</text>
<text class="sub" x="260" y="344" text-anchor="middle">not using agents for real work</text>

<!-- Single 4M -> h53 top247 -->
<rect x="450" y="247" width="120" height="53" rx="3" fill="var(--s1)"/>
<text class="val" x="510" y="239" text-anchor="middle" fill="var(--s1)">~4M</text>
<text class="grp" x="510" y="326" text-anchor="middle">Single-agent</text>
<text class="sub" x="510" y="344" text-anchor="middle">one agent, driven synchronously</text>

<!-- Multi 12-15M: band from 12 (140) to 15 (100) -->
<rect x="700" y="100" width="120" height="200" rx="3" fill="var(--good)" fill-opacity="0.35"/>
<rect x="700" y="140" width="120" height="160" rx="3" fill="var(--good)"/>
<text class="val" x="760" y="92" text-anchor="middle" fill="var(--good)">12&#8211;15M</text>
<text class="grp" x="760" y="326" text-anchor="middle">Multi-agent</text>
<text class="sub" x="760" y="344" text-anchor="middle">two to four agents, loosely supervised</text>

<text class="warn" x="640" y="120">above ~15M the number stops meaning anything</text>
</svg>
