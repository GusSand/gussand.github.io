<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" width="940" height="280" role="img" aria-label="The refusal direction is one knob with two signs: adding it induces refusal, erasing it removes refusal and jailbreaks the model.">
<style>
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
        --grid:#2c2c2a; --axis:#3d3d3a; --box:#232322; --ring:rgba(255,255,255,0.16);
        --s1:#3987e5; --s2:#d95926; --good:#0ca30c; --crit:#e66767; }
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill: var(--ink); }
  .t {font-size:17px;font-weight:600;} .st{font-size:13px;fill:var(--ink2);}
  .ct{font-size:15px;font-weight:600;} .sm{font-size:12.5px;fill:var(--ink2);}
  .lbl{font-size:13px;font-weight:600;} .xs{font-size:11px;fill:var(--muted);}
</style>
<defs>
  <marker id="ag2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--good)"/></marker>
  <marker id="acr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--crit)"/></marker>
</defs>
<rect width="940" height="280" rx="8" fill="var(--surface)"/>
<text class="t" x="20" y="34">One knob, two signs: the dual-use of a located behavior</text>
<text class="st" x="20" y="56">Refusal is mediated by a single direction. The same vector a defender adds to strengthen refusal is, negated, a rank-one jailbreak.</text>

<!-- center knob -->
<rect x="400" y="120" width="140" height="52" rx="10" fill="var(--box)" stroke="var(--ring)"/>
<text class="ct" x="470" y="143" text-anchor="middle">refusal</text>
<text class="ct" x="470" y="161" text-anchor="middle">direction</text>

<!-- add branch -->
<line x1="400" y1="146" x2="250" y2="146" stroke="var(--good)" stroke-width="2.5" marker-end="url(#ag2)"/>
<text class="lbl" x="325" y="136" text-anchor="middle" fill="var(--good)">+ add</text>
<rect x="40" y="112" width="200" height="68" rx="8" fill="none" stroke="var(--good)" stroke-width="1.5"/>
<text class="lbl" x="60" y="140">model refuses more</text>
<text class="xs" x="60" y="162">defender hardens a safe behavior</text>

<!-- erase branch -->
<line x1="540" y1="146" x2="690" y2="146" stroke="var(--crit)" stroke-width="2.5" marker-end="url(#acr)"/>
<text class="lbl" x="615" y="136" text-anchor="middle" fill="var(--crit)">&#8722; erase</text>
<rect x="700" y="112" width="210" height="68" rx="8" fill="none" stroke="var(--crit)" stroke-width="1.5"/>
<text class="lbl" x="720" y="140">model stops refusing</text>
<text class="xs" x="720" y="162">attacker jailbreaks an open model</text>

<text class="xs" x="470" y="228" text-anchor="middle">The more precisely you characterize where safety lives, the more precisely someone else can remove it.</text>
</svg>
