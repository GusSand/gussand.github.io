<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-label="Three grains at which a behavior can be localized: a direction, a feature, and a circuit.">
<style>
  svg { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
        --grid:#2c2c2a; --axis:#3d3d3a; --box:#232322; --ring:rgba(255,255,255,0.16);
        --s1:#3987e5; --s2:#d95926; --good:#0ca30c; }
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; fill: var(--ink); }
  .t {font-size:17px;font-weight:600;} .st{font-size:13px;fill:var(--ink2);}
  .ct{font-size:15px;font-weight:600;} .sm{font-size:12.5px;fill:var(--ink2);}
  .xs{font-size:11px;fill:var(--muted);}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--s1)"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--muted)"/></marker>
</defs>
<rect width="940" height="330" rx="8" fill="var(--surface)"/>
<text class="t" x="20" y="34">Where a behavior lives, at three grains</text>
<text class="st" x="20" y="56">Each grain is finer and more expensive to find than the last. Reach for the coarsest one that separates what you want to change from what you want to keep.</text>

<!-- Card 1: direction -->
<rect x="20" y="80" width="286" height="176" rx="8" fill="var(--box)" stroke="var(--ring)"/>
<text class="ct" x="36" y="106">A direction</text>
<line x1="60" y1="230" x2="270" y2="230" stroke="var(--axis)" stroke-width="1.5"/>
<line x1="80" y1="240" x2="80" y2="128" stroke="var(--axis)" stroke-width="1.5"/>
<line x1="80" y1="230" x2="238" y2="150" stroke="var(--s1)" stroke-width="3.5" marker-end="url(#ah)"/>
<text class="sm" x="196" y="142">refusal</text>
<text class="xs" x="36" y="246">one vector; found from a few prompts</text>

<!-- Card 2: feature -->
<rect x="327" y="80" width="286" height="176" rx="8" fill="var(--box)" stroke="var(--ring)"/>
<text class="ct" x="343" y="106">A feature</text>
<g>
<rect x="360" y="126" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="392" y="126" width="26" height="26" rx="3" fill="var(--s1)"/>
<rect x="424" y="126" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="456" y="126" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="488" y="126" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="520" y="126" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="360" y="158" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="392" y="158" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="424" y="158" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="456" y="158" width="26" height="26" rx="3" fill="var(--s1)"/>
<rect x="488" y="158" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="520" y="158" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="360" y="190" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="392" y="190" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="424" y="190" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="456" y="190" width="26" height="26" rx="3" fill="var(--grid)"/>
<rect x="488" y="190" width="26" height="26" rx="3" fill="var(--s2)"/>
<rect x="520" y="190" width="26" height="26" rx="3" fill="var(--grid)"/>
</g>
<text class="xs" x="343" y="246">one of thousands of sparse, named concepts</text>

<!-- Card 3: circuit -->
<rect x="634" y="80" width="286" height="176" rx="8" fill="var(--box)" stroke="var(--ring)"/>
<text class="ct" x="650" y="106">A circuit</text>
<line x1="690" y1="150" x2="770" y2="135" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ag)"/>
<line x1="690" y1="150" x2="760" y2="205" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ag)"/>
<line x1="782" y1="140" x2="850" y2="170" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ag)"/>
<line x1="772" y1="205" x2="848" y2="182" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ag)"/>
<circle cx="682" cy="150" r="14" fill="var(--s1)"/>
<circle cx="778" cy="132" r="14" fill="var(--grid)" stroke="var(--ring)"/>
<circle cx="766" cy="210" r="14" fill="var(--grid)" stroke="var(--ring)"/>
<circle cx="862" cy="176" r="14" fill="var(--good)"/>
<text class="xs" x="650" y="246">a subgraph of heads and MLPs, an algorithm</text>

<!-- bottom axis -->
<line x1="120" y1="298" x2="820" y2="298" stroke="var(--axis)" stroke-width="1.5" marker-end="url(#ag)"/>
<text class="xs" x="120" y="290">coarse &#183; cheap to find</text>
<text class="xs" x="820" y="290" text-anchor="end">fine &#183; costly to find</text>
</svg>
