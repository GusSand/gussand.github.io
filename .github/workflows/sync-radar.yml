name: sync-radar

# Pulls new reports from GusSand/research-radar into the _radar collection.
# The cloud routines publish there on their own schedule (daily Tue-Sun ~6am ET,
# weekly Mon ~6am ET); this runs after them and commits whatever is new.

on:
  schedule:
    - cron: "30 12 * * *" # 08:30 ET / 07:30 EDT, after the routines have pushed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-radar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v5

      - name: Check out research-radar
        uses: actions/checkout@v5
        with:
          repository: GusSand/research-radar
          path: .radar-source
          fetch-depth: 0 # commit dates order the backfill reports

      # The routines push to claude/radar; a launchd job on Gus's Mac merges it
      # into main, but only when the Mac is up. Merge it here too (locally, never
      # pushed) so the site doesn't depend on that job.
      - name: Merge claude/radar
        working-directory: .radar-source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify --quiet origin/claude/radar >/dev/null; then
            git merge --no-edit origin/claude/radar || { git merge --abort; echo "::warning::claude/radar conflicts with main; syncing main only"; }
          fi

      - name: Sync reports into _radar
        run: python3 scripts/sync_radar.py --source .radar-source

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- _radar; then
            echo "no new radar issues"
            exit 0
          fi
          git add _radar
          git commit -m "Sync Research Radar issues"
          git push
